<div class="shell">
  <aside class="sidebar">
    <div class="sidebar__brand">
      <span class="sidebar__mark" aria-hidden="true">O</span>
      <div>
        <p class="sidebar__title">Atelier</p>
        <p class="sidebar__subtitle">ojino-ui</p>
      </div>
    </div>

    <nav aria-label="Composants">
      @for (entry of entries(); track entry.path) {
        <a [routerLink]="entry.path" routerLinkActive="active">{{ entry.label }}</a>
      }
    </nav>

    <div class="sidebar__theme">
      <p class="sidebar__legend">Theme</p>
      <oj-segmented
        [segments]="themes"
        [value]="choice()"
        (valueChange)="choice.set($event ?? 'system')"
        label="Theme de l'atelier" />
    </div>
  </aside>

  <main class="content">
    <router-outlet />
  </main>
</div>

<oj-toast-host />
