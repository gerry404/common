  Les polices que les applications chargent elles-memes dans leur index.html.
  Storybook n'herite pas de celui d'une application : sans ce fichier, les
  icones s'afficheraient en texte brut et la typographie retomberait sur la
  police systeme — ce qui ferait mentir le catalogue.
-->
